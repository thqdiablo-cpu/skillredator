<title>Mesa de Aprovação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prova gráfica — lista de provas à esquerda, a prova aberta à direita, com carimbo de OK. */
:root{
  --paper:#F3F4F7; --surface:#FFFFFF; --ink:#16181D; --muted:#5B6270; --line:#D8DCE3; --soft:#E9EBF0;
  --magenta:#C8006B; --magenta-soft:#FBE3EF; --cyan:#00799F;
  --st-ideia:#7A808C; --st-redacao:#00799F; --st-revisao:#A86F00; --st-ajustes:#C2362B; --st-aprovado:#1F8A4C; --st-publicado:#16181D;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111318; --surface:#1A1D23; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2D313A; --soft:#22252D;
  --magenta:#FF5AAA; --magenta-soft:#3A1828; --cyan:#4CC0E6;
  --st-ideia:#9AA0AC; --st-redacao:#4CC0E6; --st-revisao:#E2A93B; --st-ajustes:#FF7468; --st-aprovado:#4CCB7F; --st-publicado:#ECEEF2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111318; --surface:#1A1D23; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2D313A; --soft:#22252D;
  --magenta:#FF5AAA; --magenta-soft:#3A1828; --cyan:#4CC0E6;
  --st-ideia:#9AA0AC; --st-redacao:#4CC0E6; --st-revisao:#E2A93B; --st-ajustes:#FF7468; --st-aprovado:#4CCB7F; --st-publicado:#ECEEF2;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Topo */
.top{max-width:1320px;margin:0 auto;padding-block:22px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1;margin:0;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.reg{width:34px;height:34px;flex:none;color:var(--ink)}
.cmyk{display:flex;height:8px;width:96px;border-radius:2px;overflow:hidden;margin-top:6px}
.cmyk i{flex:1}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.ok{background:var(--st-aprovado);border-color:var(--st-aprovado);color:#fff}
.btn.warn{color:var(--st-ajustes);border-color:var(--st-ajustes)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:13px}

.banner{max-width:1320px;margin:12px auto 0;padding:10px 14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px}

/* Pipeline resumo */
.pipe{max-width:1320px;margin:16px auto 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pipe button{background:var(--surface);border:0;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pipe button[aria-pressed="true"]{background:var(--soft);box-shadow:inset 0 -3px 0 var(--c)}
.pipe .n{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--c)}
.pipe .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Workspace */
.work{max-width:1320px;margin:16px auto 0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}
  .work.has-sel .list-pane{display:none}
  .work:not(.has-sel) .editor-pane{display:none}}
.list-pane{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
@media (max-width:900px){.list-pane{position:static}}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{flex:1 1 160px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.items{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 230px);overflow:auto;padding-right:2px}
@media (max-width:900px){.items{max-height:none}}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.item .num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.item .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag-ads{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--magenta);border:1px solid var(--magenta);border-radius:3px;padding:0 4px}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center;font-size:14px}

/* Editor */
.editor-pane{min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.sheet-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sheet-head .row1{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prova{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.title-in{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.15;border:0;background:transparent;width:100%;padding:0;letter-spacing:-.01em}
.title-in::placeholder{color:var(--muted)}
.save-state{font-size:12px;color:var(--muted)}
.back{display:none}
@media (max-width:900px){.back{display:inline-flex}}

.grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
label.f select,label.f input,.f textarea, textarea.ta, input.in{font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea.ta{resize:vertical;min-height:64px;line-height:1.45}
.typeswitch{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.typeswitch button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.typeswitch button[aria-pressed="true"].org{background:var(--ink);color:var(--paper)}
.typeswitch button[aria-pressed="true"].ads{background:var(--magenta);color:#fff}

.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
@media (max-width:1180px){.body{grid-template-columns:minmax(0,1fr)}}
.main-col{padding:18px 22px;display:flex;flex-direction:column;gap:22px;min-width:0}
.side-col{border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:20px;background:var(--paper);min-width:0}
@media (max-width:1180px){.side-col{border-left:0;border-top:1px solid var(--line)}}
section.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.blk h3 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.hint.bad{color:var(--st-ajustes)}
.hint.good{color:var(--st-aprovado)}

.slides{display:flex;flex-direction:column;gap:10px}
.slide{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.slide .sn{display:flex;flex-direction:column;align-items:center;gap:6px}
.slide .sn b{font-family:var(--mono);font-weight:500;font-size:13px;width:40px;height:40px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;background:var(--paper)}
.slide .sn .role{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;line-height:1.2}
.slide .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.slide .tools{display:flex;gap:4px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.slide .tools .acts{display:flex;gap:2px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 7px;color:var(--muted);font-size:13px}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.slide textarea.vis{min-height:38px;font-size:13px;color:var(--muted)}

.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable-wrap{overflow-x:auto}
.rtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 6px}
.rtable td{padding:4px;vertical-align:top}
.rtable td:first-child{width:86px}
.rtable textarea{min-height:52px}

.ads-box{border:1px solid var(--magenta);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--magenta-soft)}
.ads-box h3{color:var(--magenta)}
.ads-box label.f select,.ads-box label.f input,.ads-box textarea.ta{background:var(--surface)}
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* Lado: prévia, checklist, aprovação */
.preview{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;font-size:13px}
.pv-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.pv-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--magenta),var(--cyan))}
.pv-head b{font-size:13px}
.pv-head span{display:block;font-size:11px;color:var(--muted);line-height:1.1}
.pv-art{aspect-ratio:4/5;max-width:100%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:8px;position:relative}
.pv-art .big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.08;letter-spacing:-.01em;overflow-wrap:anywhere}
.pv-art .count{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:1px 7px;border-radius:10px}
.pv-cta{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--magenta);color:#fff;font-weight:600}
.pv-cap{padding:8px 10px 12px;overflow-wrap:anywhere}
.pv-cap .more{color:var(--muted)}

.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.35;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--st-aprovado);flex:none}
.cliches{font-size:12.5px;border-left:3px solid var(--st-ajustes);padding:6px 10px;background:var(--surface);border-radius:0 6px 6px 0}
.cliches b{color:var(--st-ajustes)}

.approve{display:flex;flex-direction:column;gap:10px}
.stbig{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--c)}
.stbig::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.flow{display:flex;gap:3px}
.flow i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.flow i.on{background:var(--c)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.note-in{min-height:70px}
.confirm-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}

.stamp{position:absolute;top:58px;right:24px;transform:rotate(-9deg);border:3px solid var(--st-aprovado);color:var(--st-aprovado);border-radius:6px;padding:4px 12px 5px;text-align:center;pointer-events:none;opacity:.88;font-family:var(--mono);line-height:1.15;background:var(--surface)}
.stamp b{display:block;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em}
.stamp span{font-size:10.5px;letter-spacing:.05em}
@media (max-width:600px){.stamp{top:12px;right:12px;transform:rotate(-6deg) scale(.8);transform-origin:top right}}

.notes{display:flex;flex-direction:column;gap:8px}
.note{font-size:13.5px;border-left:3px solid var(--c, var(--line));padding:4px 0 4px 10px}
.note .who{font-size:11.5px;color:var(--muted)}
.note .who b{color:var(--ink);font-weight:600}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

.ai-out{white-space:pre-wrap;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:420px;overflow:auto;overflow-wrap:anywhere}

.placeholder{padding:60px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.placeholder h2{font-family:var(--display);color:var(--ink);margin:0 0 6px;font-size:22px}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .35s ease-out}@keyframes thump{from{transform:rotate(-9deg) scale(1.5);opacity:0}}}
</style>

<header class="top">
  <div class="brand">
    <svg class="reg" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="20" cy="20" r="5" fill="currentColor"/><path d="M20 1v38M1 20h38" stroke="currentColor" stroke-width="1.6"/></svg>
    <div>
      <h1>Mesa de Aprovação</h1>
      <p>Cada copy passa pela prova antes de ir pro feed. Orgânico ou ads.</p>
      <div class="cmyk" aria-hidden="true"><i style="background:#00A3D9"></i><i style="background:#E5007D"></i><i style="background:#FFE500"></i><i style="background:#1A1A1A"></i></div>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="newBtn" type="button">+ Nova pauta</button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<nav class="pipe" id="pipe" aria-label="Etapas"></nav>

<main class="work" id="work">
  <aside class="list-pane">
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar por título, gancho, pilar…" aria-label="Buscar">
      <div class="seg" id="typeFilter" role="group" aria-label="Tipo">
        <button type="button" data-t="todos" aria-pressed="true">Todos</button>
        <button type="button" data-t="organico" aria-pressed="false">Orgânico</button>
        <button type="button" data-t="ads" aria-pressed="false">Ads</button>
      </div>
    </div>
    <div class="items" id="items"><div class="empty">Carregando a mesa…</div></div>
  </aside>
  <section class="editor-pane" id="editor">
    <div class="placeholder"><h2>Escolha uma prova</h2><p>Abra um conteúdo da lista ou crie uma pauta nova para começar a redigir.</p></div>
  </section>
</main>

<script>
(() => {
const STATUSES = [
  {k:"ideia", l:"Ideia"},
  {k:"redacao", l:"Em redação"},
  {k:"revisao", l:"Em revisão"},
  {k:"ajustes", l:"Ajustes"},
  {k:"aprovado", l:"Aprovado"},
  {k:"publicado", l:"Publicado"},
];
const ST = Object.fromEntries(STATUSES.map((s,i)=>[s.k,{...s,i}]));
const PILARES = ["Antes e depois","Raio-X","História que ninguém contou","Mercado sem filtro","Para mandar pro cliente","Olho treinado","Opinião com nome","Bastidor (humor)","Enquete","Agenda","Frase","Ferramentas","Inspiração"];
const FORMATOS = {carrossel:"Carrossel", reels:"Reels", post:"Post único", stories:"Stories"};
const PUBLICOS = {designers:"Designers", clientes:"Clientes", curiosos:"Curiosos de cultura visual"};
const OBJETIVOS = ["Reconhecimento","Tráfego","Engajamento","Mensagens","Leads","Vendas"];
const BOTOES = ["Saiba mais","Enviar mensagem","Cadastre-se","Comprar agora","Agendar","Baixar"];
const CHECK = [
  ["gancho","O gancho funciona sem o resto do post?"],
  ["fato","Tem caso, nome, data ou número real (ou marcado [CHECAR])?"],
  ["tese","Alguém poderia discordar da tese?"],
  ["unico","Nada aqui caberia em qualquer outro perfil de design?"],
  ["proibidos","Zero clichês da lista de proibidos?"],
  ["cta","O CTA dá um motivo concreto para agir?"],
  ["voz","Lido em voz alta, soa como gente e não como release?"],
];
const PROIBIDOS = ["você sabia","hoje vamos falar","a importância d","agregar valor","fazer a diferença","chamar a atenção","transmitir a mensagem","cores que transmitem","menos é mais","não é só deixar bonito","nos dias de hoje","no mundo atual","conecte-se com","outro nível","curte e compartilha","me segue para mais","comenta aí","arraste para o lado","design é tudo","design é vida","acredite no seu"];
const GENERIC_TAGS = ["#design","#art","#creative","#love","#instagood","#arte"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words = s => (String(s||"").trim().match(/\S+/g)||[]).length;
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const now = () => new Date().toISOString();

let db = null, user = null, sample = null, myId = null, canWrite = true;
let docs = [];            // [{id, ...data}]
let selId = null, draft = null, dirtyKeys = new Set(), saveTimer = null, saving = Promise.resolve();
let notes = [], unsubNotes = null;
let filterStatus = "todos", filterType = "todos", query = "";
let aiText = "", aiBusy = false, aiCtrl = null, confirmDelete = false, pendingNote = "";
let profileCache = {};

function banner(msg){ const b=$("#banner"); if(!msg){b.hidden=true;return;} b.textContent=msg; b.hidden=false; }

function blank(numero){
  return {
    numero, titulo:"", pilar:PILARES[0], formato:"carrossel", tipo:"organico", publico:["designers"],
    status:"ideia", dataPrevista:"", gancho:"",
    slides:[{texto:"",visual:""},{texto:"",visual:""},{texto:"",visual:""}],
    roteiro:[{tempo:"0–3s",fala:"",tela:""},{tempo:"3–20s",fala:"",tela:""},{tempo:"20–45s",fala:"",tela:""},{tempo:"45–60s",fala:"",tela:""}],
    textoPost:"", legenda:"", cta:"", hashtags:"",
    ads:{objetivo:"Engajamento", orcamentoDia:"", duracaoDias:"", segmentacao:"", botao:"Saiba mais", headlineA:"", headlineB:"", textoPrincipal:""},
    checklist:{}, criadoEm:now(), atualizadoEm:now(), criadoPor:myId||null
  };
}
function normalize(d){ const b = blank(d.numero||0); const o = {...b, ...d}; o.ads = {...b.ads, ...(d.ads||{})}; o.checklist = {...(d.checklist||{})};
  if(!Array.isArray(o.slides)) o.slides=b.slides; if(!Array.isArray(o.roteiro)) o.roteiro=b.roteiro; if(!Array.isArray(o.publico)) o.publico=[]; return o; }

/* ---------- Lista ---------- */
function renderPipe(){
  const counts = {}; STATUSES.forEach(s=>counts[s.k]=0); docs.forEach(d=>{ if(counts[d.status]!=null) counts[d.status]++; });
  $("#pipe").innerHTML = STATUSES.map(s => `<button type="button" data-s="${s.k}" aria-pressed="${filterStatus===s.k}" style="--c:var(--st-${s.k})"><span class="n mono">${counts[s.k]}</span><span class="l">${s.l}</span></button>`).join("");
}
function filtered(){
  const q = query.trim().toLowerCase();
  return docs.filter(d => (filterStatus==="todos"||d.status===filterStatus) && (filterType==="todos"||d.tipo===filterType) &&
    (!q || [d.titulo,d.gancho,d.pilar,d.legenda].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=> (ST[a.status]?.i??0)-(ST[b.status]?.i??0) || (b.numero||0)-(a.numero||0));
}
function renderList(){
  renderPipe();
  const el = $("#items");
  if(!db){ return; }
  const list = filtered();
  if(!docs.length){ el.innerHTML = `<div class="empty">A mesa está vazia. Crie a primeira pauta em <b>+ Nova pauta</b> ou peça ao Claude para trazer pautas do banco.</div>`; return; }
  if(!list.length){ el.innerHTML = `<div class="empty">Nada com esses filtros. ${filterStatus!=="todos"?'<button class="btn small" data-clear="1" type="button">Ver todas as etapas</button>':""}</div>`; return; }
  el.innerHTML = list.map(d => `<button type="button" class="item" data-id="${esc(d.id)}" aria-current="${d.id===selId}">
      <span class="num">Nº ${String(d.numero||0).padStart(3,"0")}</span>
      <span class="t">${esc(d.titulo||"Sem título")}</span>
      <span class="meta"><span class="pill" style="--c:var(--st-${esc(d.status)})">${esc(ST[d.status]?.l||d.status)}</span>
        <span>${esc(FORMATOS[d.formato]||d.formato)}</span>${d.tipo==="ads"?'<span class="tag-ads">ADS</span>':""}
        ${d.dataPrevista?`<span class="mono">${esc(fmtDate(d.dataPrevista))}</span>`:""}</span>
    </button>`).join("");
}
function fmtDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m?`${m[3]}/${m[2]}`:s; }

/* ---------- Editor ---------- */
function setPath(obj, path, val){ const ks=path.split("."); let o=obj; for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?+ks[i]:ks[i]; o=o[k]; } const last=ks[ks.length-1]; o[/^\d+$/.test(last)?+last:last]=val; }

function cliches(d){
  const txt = [d.titulo,d.gancho,d.textoPost,d.legenda,d.cta, ...d.slides.map(s=>s.texto), ...d.roteiro.map(r=>r.fala), d.ads.headlineA,d.ads.headlineB,d.ads.textoPrincipal].join(" \n ").toLowerCase();
  const found = PROIBIDOS.filter(p => txt.includes(p));
  const tags = (d.hashtags||"").toLowerCase().split(/\s+/).filter(Boolean);
  GENERIC_TAGS.forEach(t => { if(tags.includes(t)) found.push(t); });
  const emojiLines = (d.legenda||"").split("\n").filter(l=>/^\s*\p{Extended_Pictographic}/u.test(l)).length;
  if(emojiLines>=3) found.push("emoji como bullet");
  return found;
}

function slideRole(i,n){ if(i===0) return "gancho"; if(i===1) return "por que importa"; if(i===n-1) return "fechamento"; if(i===n-2 && n>3) return "virada"; return "desenvolvimento"; }

function hintWords(n, max, label){ return n>max ? `<span class="hint bad">${n} palavras · passe de ${max}</span>` : `<span class="hint">${n}/${max} palavras${label?" · "+label:""}</span>`; }

function adsTotal(d){
  const o = parseFloat(String(d.ads.orcamentoDia).replace(",",".")), n = parseInt(d.ads.duracaoDias,10);
  if(!(o>0) || !(n>0)) return `<span class="hint">Preencha orçamento e duração para ver o investimento total.</span>`;
  return `<span class="hint">Investimento total previsto: <b class="mono">R$ ${(o*n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</b></span>`;
}

function statusActions(s){
  const b = (to,label,cls="") => `<button type="button" class="btn small ${cls}" data-act="status" data-v="${to}">${label}</button>`;
  switch(s){
    case "ideia": return b("redacao","Começar redação","primary");
    case "redacao": return b("revisao","Enviar para revisão","primary");
    case "revisao": return b("aprovado","Aprovar","ok") + b("ajustes","Pedir ajustes","warn");
    case "ajustes": return b("revisao","Reenviar para revisão","primary") + b("redacao","Voltar à redação");
    case "aprovado": return b("publicado","Marcar como publicado","primary") + b("redacao","Reabrir");
    case "publicado": return b("redacao","Reabrir para nova versão");
  }
  return "";
}

function previewHtml(d){
  const big = d.formato==="carrossel" ? (d.slides[0]?.texto||"") : d.gancho;
  const cap = d.tipo==="ads" ? (d.ads.textoPrincipal||d.legenda) : d.legenda;
  const lim = 125, short = (cap||"").length>lim ? esc(cap.slice(0,lim)) + `<span class="more">… mais</span>` : esc(cap||"");
  return `<div class="preview">
    <div class="pv-head"><div class="pv-av"></div><div><b>seuperfil</b><span>${d.tipo==="ads"?"Patrocinado":esc(d.pilar)}</span></div></div>
    <div class="pv-art">${d.formato==="carrossel"?`<span class="count">1/${d.slides.length}</span>`:""}${d.formato==="reels"?`<span class="count">▶ Reels</span>`:""}
      <div class="big">${esc(big)||'<span style="opacity:.5">O gancho aparece aqui</span>'}</div></div>
    ${d.tipo==="ads"?`<div class="pv-cta"><span>${esc(d.ads.headlineA||"Headline A")}</span><span>${esc(d.ads.botao)} ›</span></div>`:""}
    <div class="pv-cap">${short||'<span class="more">A legenda aparece aqui.</span>'}</div></div>`;
}

const NOTE_COLOR = {nota:"var(--line)", ajuste:"var(--st-ajustes)", aprovado:"var(--st-aprovado)", status:"var(--muted)", claude:"var(--magenta)"};
function notesHtml(){
  if(!notes.length) return `<div class="hint">Sem comentários ainda. Mudanças de etapa e comentários ficam registrados aqui.</div>`;
  return notes.map(n => `<div class="note" style="--c:${NOTE_COLOR[n.tipo]||"var(--line)"}">
    <div class="who"><b data-who="${esc(n.autor||"")}" data-claude="${n.tipo==="claude"?1:""}">${n.tipo==="claude"?"Redator (Claude)":"…"}</b> · ${esc(fmtStamp(n.criadoEm))}${n.para?` · → ${esc(ST[n.para]?.l||n.para)}`:""}</div>
    ${n.texto?`<p>${esc(n.texto)}</p>`:""}</div>`).join("");
}
function fmtStamp(iso){ try{ const d=new Date(iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } }

async function resolveNames(){
  const els = [...document.querySelectorAll("[data-who]")].filter(e=>!e.dataset.claude);
  if(!els.length) return;
  const ids = [...new Set(els.map(e=>e.dataset.who).filter(Boolean))];
  let ps = {};
  if(user && ids.length){ try{ ps = await user.profiles(ids); }catch{} }
  els.forEach(e => { const id=e.dataset.who; e.textContent = (id && ps[id]?.name) || (id && id===myId ? "Você" : "Alguém"); });
}

/* ---------- Gravação ---------- */
function markDirty(key){ dirtyKeys.add(key); setSave("Salvando…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
function setSave(t){ const s=$("#saveState"); if(s) s.textContent=t; }
function flush(){
  clearTimeout(saveTimer);
  if(!dirtyKeys.size || !selId || !draft) return saving;
  const id = selId, patch = {}; dirtyKeys.forEach(k => patch[k] = clone(draft[k])); dirtyKeys.clear();
  patch.atualizadoEm = now();
  saving = saving.then(() => db.collection("conteudos").doc(id).update(patch))
    .then(() => { if(selId===id && !dirtyKeys.size) setSave("Salvo"); })
    .catch(e => { setSave("Não salvou"); writeError(e); });
  return saving;
}
function writeError(e){
  if(e?.code==="invalid_argument" && canWrite===null){ canWrite=false; renderEditor(); return; }
  banner(e?.code==="quota_exceeded" ? "A mesa atingiu o limite de armazenamento. Exclua provas antigas para criar novas." : "Não foi possível salvar agora. Confira sua conexão e tente de novo.");
}
function liveHints(){
  // atualiza só a prévia, sem redesenhar os campos em edição
  const pv = document.getElementById("pvBox"); if(pv && draft) pv.innerHTML = previewHtml(draft);
}
function refreshCliches(){
  const box = document.getElementById("clicheBox"); if(!box || !draft) return;
  const found = cliches(draft);
  box.innerHTML = found.length?`<div class="cliches"><b>Clichês encontrados:</b> ${found.map(esc).join(", ")}</div>`:`<div class="hint good">Nenhum clichê da lista encontrado no texto.</div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id==="q"){ query=t.value; renderList(); return; }
  if(t.id==="noteIn"){ pendingNote=t.value; return; }
  const f = t.dataset?.f; if(!f || !draft || !canWrite) return;
  setPath(draft, f, t.value); markDirty(f.split(".")[0]);
  liveHints();
  const tool = t.closest(".slide")?.querySelector(".tools .hint");
  if(tool && f.endsWith(".texto")){ const i=+f.split(".")[1]; tool.outerHTML = i===0?hintWords(words(t.value),12,"gancho"):hintWords(words(t.value),40); }
});
document.addEventListener("change", e => {
  const t = e.target; if(!draft || !canWrite) return;
  if(t.dataset.f && (t.tagName==="SELECT" || t.type==="date")){ setPath(draft,t.dataset.f,t.value); markDirty(t.dataset.f.split(".")[0]); flush(); if(t.dataset.f==="ads.objetivo"||t.dataset.f==="ads.botao") liveHints(); return; }
  if(t.dataset.f){ flush(); refreshCliches(); return; }
  if(t.dataset.act==="formato"){ draft.formato=t.value; markDirty("formato"); flush(); renderEditor(); return; }
  if(t.dataset.act==="pub"){ const v=t.dataset.v; draft.publico = t.checked ? [...new Set([...draft.publico,v])] : draft.publico.filter(x=>x!==v); markDirty("publico"); flush(); return; }
  if(t.dataset.act==="check"){ draft.checklist[t.dataset.v]=t.checked; markDirty("checklist"); flush(); renderEditor(); return; }
});

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.closest("#pipe")){ const s=b.dataset.s; filterStatus = filterStatus===s ? "todos" : s; renderList(); return; }
  if(b.dataset.clear){ filterStatus="todos"; renderList(); return; }
  if(b.closest("#typeFilter")){ filterType=b.dataset.t; document.querySelectorAll("#typeFilter button").forEach(x=>x.setAttribute("aria-pressed", x===b)); renderList(); return; }
  if(b.classList.contains("item")){ select(b.dataset.id); return; }
  if(b.id==="newBtn"){ createNew(); return; }
  const act = b.dataset.act; if(!act) return;
  if(act==="back"){ flush(); selId=null; draft=null; stopNotes(); renderEditor(); renderList(); return; }
  if(act==="ai"){ askClaude(); return; }
  if(!canWrite || !draft) return;
  const i = +b.dataset.i;
  if(act==="tipo"){ draft.tipo=b.dataset.v; markDirty("tipo"); flush(); renderEditor(); return; }
  if(act==="add"){ draft.slides.push({texto:"",visual:""}); markDirty("slides"); flush(); renderEditor(); document.getElementById("sl-"+(draft.slides.length-1))?.focus(); return; }
  if(act==="rm"){ draft.slides.splice(i,1); markDirty("slides"); flush(); renderEditor(); return; }
  if(act==="up"||act==="down"){ const j = act==="up"?i-1:i+1; [draft.slides[i],draft.slides[j]]=[draft.slides[j],draft.slides[i]]; markDirty("slides"); flush(); renderEditor(); return; }
  if(act==="addr"){ draft.roteiro.push({tempo:"",fala:"",tela:""}); markDirty("roteiro"); flush(); renderEditor(); return; }
  if(act==="rmr"){ draft.roteiro.splice(i,1); markDirty("roteiro"); flush(); renderEditor(); return; }
  if(act==="status"){ changeStatus(b.dataset.v); return; }
  if(act==="aisave"){ addNote({tipo:"claude", texto:aiText}); aiText=""; renderEditor(); return; }
  if(act==="del"){ confirmDelete=true; renderEditor(); return; }
  if(act==="delno"){ confirmDelete=false; renderEditor(); return; }
  if(act==="delyes"){ removeSel(); return; }
});

async function changeStatus(to){
  const from = draft.status;
  if(to==="ajustes" && !pendingNote.trim()){ const n=$("#noteIn"); if(n){ n.focus(); n.placeholder="Diga o que precisa mudar antes de pedir ajustes."; n.style.borderColor="var(--st-ajustes)"; } return; }
  draft.status = to; dirtyKeys.add("status");
  if(to==="aprovado"){ draft.aprovadoPor = myId||null; draft.aprovadoEm = now(); dirtyKeys.add("aprovadoPor"); dirtyKeys.add("aprovadoEm"); }
  await flush();
  const texto = pendingNote.trim(); pendingNote="";
  await addNote({tipo: to==="aprovado"?"aprovado": to==="ajustes"?"ajuste":"status", texto, de:from, para:to});
  renderEditor(); renderList();
}
async function addNote(n){
  if(!selId) return;
  try{ await db.collection("conteudos").doc(selId).collection("notas").add({texto:n.texto||"", tipo:n.tipo||"nota", de:n.de||null, para:n.para||null, autor:myId||null, criadoEm:now()}); }
  catch(e){ writeError(e); }
}
async function createNew(){
  if(!db){ return; }
  if(!canWrite){ banner("Você tem acesso só de leitura nesta mesa."); return; }
  await flush();
  const numero = docs.reduce((m,d)=>Math.max(m,d.numero||0),0)+1;
  const data = blank(numero);
  try{ const ref = db.collection("conteudos").doc(); await ref.set(data); select(ref.id, {...data,id:ref.id}); }
  catch(e){ writeError(e); }
}
async function removeSel(){
  const id = selId; confirmDelete=false;
  try{ await db.collection("conteudos").doc(id).delete(); selId=null; draft=null; stopNotes(); renderEditor(); renderList(); }
  catch(e){ writeError(e); }
}

function stopNotes(){ if(unsubNotes){ unsubNotes(); unsubNotes=null; } notes=[]; }
function select(id, seed){
  flush();
  if(selId!==id){ aiText=""; pendingNote=""; confirmDelete=false; aiCtrl?.abort(); aiBusy=false; }
  selId = id;
  const d = seed || docs.find(x=>x.id===id); draft = d ? normalize(clone(d)) : null;
  stopNotes();
  unsubNotes = db.collection("conteudos").doc(id).collection("notas").orderBy("criadoEm","desc").limit(100)
    .onSnapshot(s => { notes = s.docs.map(x=>({id:x.id,...x.data()})); const box=$("#notes"); if(box){ box.innerHTML=notesHtml(); box.closest("section").querySelector("h3 small").textContent=notes.length; resolveNames(); } }, () => {});
  renderEditor(); renderList();
  if(matchMedia("(max-width:900px)").matches) window.scrollTo({top:0});
}

/* ---------- Claude ---------- */
function proofAsText(d){
  const L=[];
  L.push(`Tipo: ${d.tipo==="ads"?"ANÚNCIO (ads)":"orgânico"} · Formato: ${FORMATOS[d.formato]} · Pilar: ${d.pilar} · Público: ${d.publico.map(p=>PUBLICOS[p]).join(", ")||"não definido"}`);
  L.push(`Título interno: ${d.titulo}`);
  if(d.formato==="carrossel") d.slides.forEach((s,i)=>L.push(`Slide ${i+1}: ${s.texto}${s.visual?`  [visual: ${s.visual}]`:""}`));
  else if(d.formato==="reels"){ L.push(`Gancho falado: ${d.gancho}`); d.roteiro.forEach(r=>L.push(`${r.tempo} | fala: ${r.fala} | tela: ${r.tela}`)); }
  else { L.push(`Gancho: ${d.gancho}`); L.push(`Texto: ${d.textoPost}`); }
  L.push(`Legenda: ${d.legenda}`); L.push(`CTA: ${d.cta}`); L.push(`Hashtags: ${d.hashtags}`);
  if(d.tipo==="ads") L.push(`Ads → objetivo: ${d.ads.objetivo}; público: ${d.ads.segmentacao}; texto principal: ${d.ads.textoPrincipal}; headline A: ${d.ads.headlineA}; headline B: ${d.ads.headlineB}; botão: ${d.ads.botao}`);
  return L.join("\n");
}
async function askClaude(){
  if(aiBusy || !draft) return;
  if(!sample){ aiText="O parecer do redator não está disponível nesta visualização. Peça direto ao Claude na conversa citando o Nº da prova."; renderEditor(); return; }
  await flush();
  aiBusy=true; aiText=""; renderEditor();
  aiCtrl = new AbortController();
  const id = selId;
  const prompt = `Você é um redator sênior de Instagram no nicho de design gráfico, brasileiro, que odeia conteúdo genérico. Avalie a prova abaixo com estas regras:
- Específico vence abstrato; todo post precisa de um fato, caso ou número verificável (nunca invente; marque [CHECAR] o que precisa de checagem).
- Precisa ter uma tese da qual dá para discordar. Brasil primeiro nos exemplos. Escreva como gente.
- Carrossel: slide 1 até 12 palavras; slide 2 diz por que importa; uma ideia por slide (~40 palavras); penúltimo é a virada; último fecha com CTA com motivo. 7 a 10 slides.
- Legenda 80–200 palavras, primeira linha funciona sozinha, 3–6 hashtags específicas.
- Proibido: "Você sabia", "a importância de", "agregar valor", psicologia das cores de almanaque, emoji como bullet, "curte e compartilha".
- Se for ADS: o gancho precisa parar quem não segue o perfil, o texto principal precisa funcionar em 125 caracteres, headlines A e B devem testar ângulos diferentes, e o CTA deve combinar com o objetivo.

Responda em português, em texto simples (sem markdown pesado), neste formato:
NOTA: x/10 e uma frase de veredito
O QUE ESTÁ GENÉRICO: até 4 itens, citando o trecho
O QUE FUNCIONA: até 2 itens
GANCHOS ALTERNATIVOS: 2 opções
${draft.tipo==="ads"?"HEADLINES A/B SUGERIDAS: 2 pares\n":""}PRÓXIMO PASSO: uma ação concreta

PROVA:
${proofAsText(draft)}`;
  try{
    const r = await sample(prompt, {signal:aiCtrl.signal, cache:false, onText:({text})=>{ if(selId!==id) return; aiText=text; const o=$("#aiOut"); if(o){ o.hidden=false; o.textContent=text; } }});
    if(selId===id) aiText = r.text;
  }catch(e){
    if(selId===id) aiText = e?.code==="not_granted" ? "Parecer não autorizado nesta visualização." : e?.code==="rate_limited" ? "Muitos pedidos seguidos. Espere um pouco e tente de novo." : (e?.text || "Não foi possível obter o parecer agora.");
  }
  if(selId===id){ aiBusy=false; renderEditor(); }
}

/* ---------- Boot ---------- */
async function boot(){
  const c = window.claude;
  if(!c?.use){ $("#items").innerHTML = `<div class="empty">Abra esta página no claude.ai, com login, para usar a mesa.</div>`; return; }
  [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  c.use("sample").then(s => { sample = s; }).catch(()=>{});
  if(!db){ $("#items").innerHTML = `<div class="empty">Entre na sua conta do claude.ai para ver e editar as provas.</div>`; $("#newBtn").disabled=true; return; }
  if(user){ try{ myId = await user.id(); }catch{} const w = user.can ? await user.can("data.write") : null; canWrite = w===false ? false : (w===true ? true : null); }
  if(canWrite===false){ $("#newBtn").hidden=true; banner("Você está vendo a mesa em modo leitura."); }
  let timer = setTimeout(()=>banner("A mesa ainda não respondeu. Os dados podem estar desatualizados."), 10000);
  db.collection("conteudos").onSnapshot(snap => {
    if(!snap.metadata.fromCache){ clearTimeout(timer); banner(null); }
    docs = snap.docs.map(x=>({id:x.id, ...x.data()}));
    renderList();
    if(selId){
      const cur = docs.find(x=>x.id===selId);
      if(!cur){ selId=null; draft=null; stopNotes(); renderEditor(); return; }
      const editing = document.activeElement && document.querySelector("#editor")?.contains(document.activeElement) && document.activeElement.matches("input,textarea");
      if(!dirtyKeys.size && !editing && !snap.metadata.hasPendingWrites){
        const next = normalize(clone(cur));
        if(JSON.stringify(next)!==JSON.stringify(draft)){ draft = next; renderEditor(); }
      }
    }
  }, err => { clearTimeout(timer); banner(err?.code==="revoked" ? "O acesso a esta mesa mudou." : "Não foi possível carregar a mesa."); });
}
renderPipe();
boot();
})();
</script>
